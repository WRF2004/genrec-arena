[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dualsid-qwen"
version = "0.1.0"
description = "Dual semantic/collaborative SID generative retrieval with Qwen2.5"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "transformers>=4.46,<5", "peft>=0.14,<1", "accelerate>=1.2,<2", "numpy>=1.26,<3", "scipy>=1.11", "scikit-learn>=1.4", "tokenizers>=0.20"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dualsid = "dualsid.cli:main"

[tool.setuptools.packages.find]
include = ["dualsid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
