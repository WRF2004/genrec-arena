[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genrec-arena"
version = "0.1.0"
description = "Competition-inspired, reproducible semantic-ID generative recommendation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "torch>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
[project.scripts]
genrec = "genrec.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
